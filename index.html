<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ölçek Defteri</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#1d4a3c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ölçek Defteri">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f3f5f2; --sheet:#ffffff; --ink:#1b2420; --muted:#5d6a63; --faint:#8a958f;
  --rule:#dde2dc; --rule-strong:#b9c2bc; --cover:#1d4a3c; --cover-2:#173d31; --cover-ink:#e6eee8; --cover-muted:#9fb8ac;
  --brass:#a8802f; --brass-soft:#f3ead6; --yes:#1d4a3c; --yes-soft:#e3eee7; --no:#9c3f2b; --no-soft:#f6e6e1;
  --zebra:#f8faf8; --focus:#c99a36; --shadow:0 1px 0 rgba(27,36,32,.04),0 8px 24px -16px rgba(27,36,32,.25);
  --serif:"Literata",Georgia,"Times New Roman",serif; --sans:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#121614; --sheet:#1a201d; --ink:#e7ece8; --muted:#a3b0a9; --faint:#76827c; --rule:#2c3531; --rule-strong:#3d4843;
  --cover:#10251e; --cover-2:#0c1d17; --cover-ink:#dfe9e3; --cover-muted:#86a396; --brass:#d2ab5c; --brass-soft:#352c1a;
  --yes:#8fcfae; --yes-soft:#1d3329; --no:#e59a86; --no-soft:#3a2420; --zebra:#1d2420; --focus:#d2ab5c; color-scheme:dark;
  --shadow:0 1px 0 rgba(0,0,0,.2),0 10px 24px -16px rgba(0,0,0,.6);
}}
:root[data-theme="dark"]{
  --paper:#121614; --sheet:#1a201d; --ink:#e7ece8; --muted:#a3b0a9; --faint:#76827c; --rule:#2c3531; --rule-strong:#3d4843;
  --cover:#10251e; --cover-2:#0c1d17; --cover-ink:#dfe9e3; --cover-muted:#86a396; --brass:#d2ab5c; --brass-soft:#352c1a;
  --yes:#8fcfae; --yes-soft:#1d3329; --no:#e59a86; --no-soft:#3a2420; --zebra:#1d2420; --focus:#d2ab5c; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100%}
/* Cover */
.cover{background:linear-gradient(180deg,var(--cover),var(--cover-2));color:var(--cover-ink);padding:26px 18px 18px;display:flex;flex-direction:column;gap:26px;position:sticky;top:0;height:100vh;height:100dvh}
.brand{font-family:var(--serif);font-size:25px;line-height:1.1;font-weight:600;letter-spacing:-.01em;margin:0}
.brand small{display:block;font:500 12.5px/1.4 var(--sans);color:var(--cover-muted);margin-top:8px;letter-spacing:0}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:7px;color:var(--cover-muted);font-weight:500}
.nav button:hover{color:var(--cover-ink);background:rgba(255,255,255,.05)}
.nav button[aria-current="page"]{color:var(--cover-ink);background:rgba(255,255,255,.09);box-shadow:inset 3px 0 0 var(--brass)}
.nav button:focus-visible{outline:2px solid var(--focus)}
.nav .count{margin-left:auto;font-size:12px;opacity:.7}
.cover-foot{margin-top:auto;font-size:12.5px;color:var(--cover-muted);line-height:1.45}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--brass);margin-right:7px;vertical-align:1px}
.dot.ok{background:#7fc4a0}
/* Main */
main{min-width:0;padding:28px clamp(16px,3vw,40px) 60px}
.page-title{font-family:var(--serif);font-size:30px;line-height:1.15;font-weight:600;letter-spacing:-.015em;margin:0 0 4px}
.lede{color:var(--muted);margin:0 0 22px;max-width:68ch}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.btn{border:1px solid var(--rule-strong);background:var(--sheet);border-radius:8px;padding:8px 14px;font-weight:500;font-size:14px;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--cover);border-color:var(--cover);color:#f1f6f2}
.btn.primary:hover{background:var(--cover-2)}
.btn.quiet{border-color:transparent;background:transparent;color:var(--muted)}
.btn.quiet:hover{color:var(--ink);background:var(--rule)}
.btn.danger{color:var(--no)}
.btn:disabled{opacity:.45;cursor:default}
.btn svg{width:16px;height:16px}
.field{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--muted);font-weight:500}
.field > input,.field > select,.field > textarea,.inp{border:1px solid var(--rule-strong);background:var(--sheet);border-radius:8px;padding:8px 10px;font-size:14.5px;color:var(--ink);min-width:0}
textarea{resize:vertical;line-height:1.45}
.field > select,.field > input{width:100%}
.split > *{min-width:0}
.field > input:focus,.field > select:focus,.field > textarea:focus,.inp:focus{outline:none;border-color:var(--cover);box-shadow:0 0 0 3px color-mix(in srgb,var(--cover) 18%,transparent)}
/* Toolbar */
.toolbar{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1fr);gap:12px;margin-bottom:18px}
/* Sheet */
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;box-shadow:var(--shadow)}
.sheet-head{padding:20px 22px 14px;display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap;border-bottom:1px solid var(--rule)}
.sheet-head h2{font-family:var(--serif);font-weight:600;font-size:23px;line-height:1.2;margin:0;letter-spacing:-.01em}
.sheet-head .meta{color:var(--muted);font-size:13.5px;margin-top:3px}
.progress{height:4px;background:var(--rule);border-radius:4px;overflow:hidden;width:160px;margin-top:8px}
.progress i{display:block;height:100%;background:var(--brass);transition:width .25s}
.key{padding:12px 22px;border-bottom:1px solid var(--rule);font-size:13.5px}
.key summary{cursor:pointer;color:var(--muted);font-weight:500;list-style:none;display:flex;gap:8px;align-items:center}
.key summary::before{content:"";width:7px;height:7px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(-45deg);transition:transform .15s}
.key[open] summary::before{transform:rotate(45deg)}
.key ol{margin:10px 0 2px;padding:0;list-style:none;display:grid;gap:5px;max-width:95ch}
.key li{display:grid;grid-template-columns:34px 1fr;gap:6px}
.key li b{color:var(--brass);font-weight:600}
.key .lv{grid-template-columns:34px 1fr}
.hint{color:var(--faint);font-size:12.5px;margin:10px 0 0}
kbd{font:600 11px var(--sans);border:1px solid var(--rule-strong);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--paper)}
/* Grid */
.grid-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.grid{border-collapse:separate;border-spacing:0;width:100%;font-size:14px}
.grid th,.grid td{border-bottom:1px solid var(--rule);padding:0;text-align:center;white-space:nowrap}
.grid thead th{position:sticky;top:0;background:var(--sheet);z-index:2;font-size:12px;font-weight:600;color:var(--muted);padding:8px 4px;border-bottom:1px solid var(--rule-strong)}
.grid thead th.grp{border-left:1px solid var(--rule)}
.grid tbody tr:nth-child(even) td{background:var(--zebra)}
.grid tbody tr:hover td,.grid tbody tr:hover td.nm{background:color-mix(in srgb,var(--brass-soft) 55%,var(--sheet))}
.grid td.sn{color:var(--faint);font-size:12px;width:36px}
.grid td.no{color:var(--muted);font-size:12.5px;width:48px}
.grid td.nm,.grid th.nm{text-align:left;padding:0 12px 0 6px;font-weight:500;min-width:190px;position:sticky;left:0;z-index:1;background:inherit}
.grid tbody td.nm{background:var(--sheet)}
.grid tbody tr:nth-child(even) td.nm{background:var(--zebra)}
.grid thead th.nm{z-index:3}
.colh{all:unset;cursor:pointer;display:inline-flex;flex-direction:column;align-items:center;gap:1px;padding:2px 8px;border-radius:6px;color:var(--ink)}
.colh:hover{background:var(--rule)}
.colh small{font-weight:500;color:var(--faint);font-size:10.5px}
.colh:focus-visible{outline:2px solid var(--focus)}
.grid td.cc{border-left:1px solid var(--rule);padding:3px}
.c{all:unset;box-sizing:border-box;cursor:pointer;display:grid;place-items:center;width:100%;min-width:40px;height:34px;border-radius:6px;font-weight:600;font-size:14.5px;color:var(--faint)}
.c:hover{background:var(--rule)}
.c:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.c.empty::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--rule-strong)}
.c.v-yes{background:var(--yes-soft);color:var(--yes)}
.c.v-no{background:var(--no-soft);color:var(--no)}
.c.v-num{background:var(--brass-soft);color:var(--ink)}
.c.stamp{animation:stamp .18s ease-out}
@keyframes stamp{from{transform:scale(.8)}to{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.c.stamp{animation:none}.progress i{transition:none}}
.lvset{display:flex;gap:4px;justify-content:center;padding:3px 6px}
.lvb{all:unset;box-sizing:border-box;cursor:pointer;width:36px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:600;color:var(--muted);border:1.5px solid var(--rule-strong);font-size:14px}
.lvb:hover{border-color:var(--ink);color:var(--ink)}
.lvb[aria-pressed="true"]{background:var(--cover);border-color:var(--cover);color:#f3f7f4}
.lvb:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.grid td.tot{font-weight:600;width:62px;border-left:1px solid var(--rule-strong)}
.grid td.nt{padding:3px 8px;min-width:200px}
.grid thead th.nth{text-align:left;padding-left:18px}
.grid td.ex{padding:3px 6px;width:96px;border-left:1px solid var(--rule)}
.cellin{width:100%;border:1px solid transparent;background:transparent;border-radius:6px;padding:6px 8px;font-size:13.5px;color:var(--ink)}
.cellin:hover{border-color:var(--rule)}
.cellin:focus{outline:none;border-color:var(--cover);background:var(--sheet)}
.cellin::placeholder{color:var(--faint)}
.grid tfoot td{padding:8px 4px;font-size:12px;color:var(--muted);border-bottom:none;border-top:1px solid var(--rule-strong);white-space:normal}
.grid tfoot td.nm{font-weight:600;color:var(--ink);font-size:12.5px}
.sum-yes{color:var(--yes);font-weight:600}.sum-no{color:var(--no);font-weight:600}
/* Popover */
.pop{position:absolute;z-index:40;background:var(--sheet);border:1px solid var(--rule-strong);border-radius:10px;box-shadow:0 12px 32px -12px rgba(0,0,0,.35);padding:6px;min-width:180px}
.pop[hidden]{display:none}
.pop h4{margin:4px 8px 6px;font-size:12px;color:var(--muted);font-weight:600}
.pop button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:10px;align-items:center;width:100%;padding:8px 10px;border-radius:7px;font-size:14px}
.pop button:hover,.pop button:focus-visible{background:var(--paper)}
.pop button b{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--brass-soft);font-size:13px}
.pop hr{border:0;border-top:1px solid var(--rule);margin:4px 0}
/* Lists / editors */
.split{display:grid;grid-template-columns:minmax(240px,320px) 1fr;gap:20px;align-items:start}
.list{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;overflow:hidden}
.list button.item{all:unset;box-sizing:border-box;cursor:pointer;display:block;width:100%;padding:12px 16px;border-bottom:1px solid var(--rule)}
.list button.item:last-child{border-bottom:none}
.list button.item:hover{background:var(--paper)}
.list button.item[aria-current="true"]{background:var(--brass-soft);box-shadow:inset 3px 0 0 var(--brass)}
.list button.item:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.item-t{font-weight:600;display:block;line-height:1.3}
.item-m{font-size:12.5px;color:var(--muted)}
.editor{padding:22px;display:grid;gap:18px}
.editor .title-in{font-family:var(--serif);font-size:22px;font-weight:600;border:0;border-bottom:1px solid var(--rule-strong);border-radius:0;padding:4px 0;background:transparent}
.editor .title-in:focus{outline:none;border-bottom-color:var(--cover);box-shadow:none}
.seg{display:inline-flex;border:1px solid var(--rule-strong);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{all:unset;cursor:pointer;padding:6px 12px;border-radius:6px;font-size:13.5px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--cover);color:#f1f6f2}
.seg button:focus-visible{outline:2px solid var(--focus)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.sec-h{display:flex;align-items:baseline;gap:10px;margin:6px 0 -6px}
.sec-h h3{font-family:var(--serif);font-size:17px;font-weight:600;margin:0}
.sec-h p{margin:0;color:var(--muted);font-size:13px}
.crit{display:grid;grid-template-columns:40px 1fr auto;gap:8px;align-items:start;padding:10px 0;border-top:1px solid var(--rule)}
.crit .code{font-weight:600;color:var(--brass);padding-top:8px}
.crit textarea{min-height:40px}
.crit .tools{display:flex;gap:2px;padding-top:3px}
.ibtn{all:unset;cursor:pointer;width:30px;height:30px;border-radius:6px;display:grid;place-items:center;color:var(--muted)}
.ibtn:hover{background:var(--rule);color:var(--ink)}
.ibtn:focus-visible{outline:2px solid var(--focus)}
.ibtn svg{width:16px;height:16px}
.tanim{grid-column:2/3;display:grid;gap:6px;margin-top:4px}
.tanim label{display:grid;grid-template-columns:110px 1fr;gap:8px;align-items:start;font-size:12.5px;color:var(--muted)}
.opt{display:grid;grid-template-columns:70px 1fr auto;gap:8px;align-items:start;padding:8px 0;border-top:1px solid var(--rule)}
.opt.lvl{grid-template-columns:70px 1fr auto}
.note{background:var(--brass-soft);border-radius:9px;padding:10px 14px;font-size:13.5px;color:var(--ink)}
.empty-state{padding:44px 26px;text-align:center;display:grid;gap:14px;justify-items:center}
.empty-state h2{font-family:var(--serif);font-weight:600;font-size:22px;margin:0}
.empty-state p{margin:0;color:var(--muted);max-width:52ch}
table.plain{border-collapse:collapse;width:100%;font-size:14px}
.plain th,.plain td{border-bottom:1px solid var(--rule);padding:4px 6px;text-align:left}
.plain th{font-size:12px;color:var(--muted);font-weight:600}
.plain td.n{color:var(--faint);width:36px;font-size:12.5px}
/* Modal */
.modal{position:fixed;inset:0;z-index:60;background:rgba(15,22,19,.45);display:grid;place-items:center;padding:16px}
.modal[hidden]{display:none}
.dialog{background:var(--sheet);border-radius:14px;max-width:560px;width:100%;max-height:calc(100% - 32px);overflow:auto;padding:22px;box-shadow:0 24px 60px -20px rgba(0,0,0,.5);display:grid;gap:14px}
.dialog h2{font-family:var(--serif);font-weight:600;font-size:21px;margin:0}
.dialog p{margin:0;color:var(--muted)}
.checks{display:grid;gap:2px;max-height:300px;overflow:auto;border:1px solid var(--rule);border-radius:9px;padding:6px}
.checks label{display:flex;gap:10px;align-items:center;padding:6px 8px;border-radius:6px;font-size:14px}
.checks label:hover{background:var(--paper)}
.checks .tag{margin-left:auto;font-size:12px;color:var(--muted)}
.radio-cards{display:grid;gap:8px}
.radio-cards label{display:grid;grid-template-columns:20px 1fr;gap:10px;border:1px solid var(--rule-strong);border-radius:10px;padding:10px 12px;cursor:pointer}
.radio-cards label:has(input:checked){border-color:var(--cover);background:var(--yes-soft)}
.radio-cards small{display:block;color:var(--muted);font-size:12.5px}
.drop{border:1.5px dashed var(--rule-strong);border-radius:12px;padding:22px;text-align:center;color:var(--muted);display:grid;gap:8px;justify-items:center}
.drop.over{border-color:var(--cover);background:var(--yes-soft)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:9px;font-size:14px;z-index:80;box-shadow:0 10px 30px -10px rgba(0,0,0,.4);max-width:calc(100% - 32px)}
.toast[hidden]{display:none}
.spin{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:rot .7s linear infinite;display:inline-block}
@keyframes rot{to{transform:rotate(360deg)}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* Etiketler & analiz */
.tagrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px}
.tagrow label{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--muted)}
.inp.sm{padding:4px 8px;font-size:13px;width:190px}
.seg.sm{padding:2px}.seg.sm button{padding:3px 10px;font-size:12.5px}
.an-sec{padding:18px 22px;border-top:1px solid var(--rule)}
.an-sec:first-child{border-top:0}
.an-sec h3{font-family:var(--serif);font-size:18px;font-weight:600;margin:0 0 4px}
.an-sec > p{margin:0 0 12px;color:var(--muted);font-size:13.5px;max-width:75ch}
.flag{display:grid;grid-template-columns:minmax(160px,220px) 1fr;gap:10px;padding:9px 0;border-top:1px solid var(--rule);align-items:baseline}
.flag:first-of-type{border-top:0}
.linkbtn{all:unset;cursor:pointer;font-weight:600;color:var(--ink);text-decoration:underline;text-decoration-color:var(--rule-strong);text-underline-offset:3px}
.linkbtn:hover{text-decoration-color:var(--ink)}
.linkbtn:focus-visible{outline:2px solid var(--focus)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12.5px;padding:2px 9px;border-radius:999px;background:var(--no-soft);color:var(--no)}
.chip.warn{background:var(--brass-soft);color:var(--ink)}
.chip.ok{background:var(--yes-soft);color:var(--yes)}
.chip.muted{background:var(--paper);color:var(--muted)}
.struggle{display:grid;grid-template-columns:1fr auto;gap:12px;padding:9px 0;border-top:1px solid var(--rule)}
.struggle:first-of-type{border-top:0}
.struggle small{color:var(--muted);display:block}
.pct{font-weight:600;font-variant-numeric:tabular-nums}
table.heat{border-collapse:separate;border-spacing:0;width:100%;font-size:13.5px}
.heat th{font-size:12px;color:var(--muted);font-weight:600;padding:6px 6px;text-align:center;border-bottom:1px solid var(--rule-strong);white-space:nowrap}
.heat th button{all:unset;cursor:pointer;padding:2px 6px;border-radius:5px}
.heat th button:hover{background:var(--rule)}
.heat th button[aria-sort]:not([aria-sort="none"]){color:var(--ink);box-shadow:inset 0 -2px 0 var(--brass)}
.heat td{padding:3px;border-bottom:1px solid var(--rule);text-align:center}
.heat td.nm{text-align:left;padding:3px 10px 3px 4px;white-space:nowrap}
.hc{display:grid;place-items:center;border-radius:6px;height:32px;min-width:64px;font-weight:600;font-variant-numeric:tabular-nums;font-size:13px;line-height:1.1}
.hc small{font-weight:500;font-size:10.5px;opacity:.7}
.hc.lo{background:var(--no-soft);color:var(--no)}.hc.mid{background:var(--brass-soft);color:var(--ink)}.hc.hi{background:var(--yes-soft);color:var(--yes)}
.hc.few{opacity:.55;outline:1px dashed var(--rule-strong);outline-offset:-1px}
.hc.none{color:var(--rule-strong)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:10px;align-items:center}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:5px}
.dialog.wide{max-width:780px}
.skill{display:grid;grid-template-columns:150px 1fr 118px;gap:12px;align-items:center;padding:7px 0;border-top:1px solid var(--rule);font-size:14px}
.skill:first-of-type{border-top:0}
.bar{height:8px;background:var(--rule);border-radius:4px;overflow:hidden;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:4px}
.skill .m{font-size:12.5px;color:var(--muted);text-align:right}
.summary{background:var(--paper);border-radius:10px;padding:12px 14px;font-size:14px;line-height:1.55}
table.obs{border-collapse:collapse;width:100%;font-size:13px}
.obs th,.obs td{border-bottom:1px solid var(--rule);padding:5px 6px;text-align:left;vertical-align:top}
.obs th{font-size:11.5px;color:var(--muted);font-weight:600}
.obs .r{white-space:nowrap;font-weight:600}
.r.lo{color:var(--no)}.r.hi{color:var(--yes)}
/* Kart */
.card{padding:18px 22px 22px;display:grid;gap:14px;max-width:680px}
.card-name{font-family:var(--serif);font-size:23px;font-weight:600;line-height:1.2}
.card .meta{color:var(--muted);font-size:13.5px;margin-top:3px}
.card-q{border-top:1px solid var(--rule);padding-top:12px;display:grid;gap:9px;font-size:14.5px}
.kbs{display:flex;gap:8px;flex-wrap:wrap}
.kb{all:unset;box-sizing:border-box;cursor:pointer;min-width:68px;height:46px;padding:0 16px;border-radius:10px;border:1.5px solid var(--rule-strong);display:grid;place-items:center;font-weight:600;font-size:15px}
.kb[aria-pressed="true"]{background:var(--cover);border-color:var(--cover);color:#f3f7f4}
.kb.y[aria-pressed="true"]{background:var(--yes);border-color:var(--yes);color:var(--sheet)}
.kb.n[aria-pressed="true"]{background:var(--no);border-color:var(--no);color:var(--sheet)}
.kb:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.md{font-size:15px;line-height:1.6;max-width:70ch}
.md h3{font-family:var(--serif);font-size:18px;font-weight:600;margin:18px 0 6px}
.md h3:first-child{margin-top:0}
.md h4{font-size:14.5px;font-weight:600;margin:12px 0 4px}
.md p{margin:0 0 10px}
.md ul,.md ol{margin:0 0 10px;padding-left:22px}
.md li{margin:3px 0}
.md strong{font-weight:600}
body.locked .cover{display:none}body.locked .app{grid-template-columns:minmax(0,1fr)}
.login{max-width:440px;margin:8vh auto 0;padding:26px;display:grid;gap:14px}
/* Responsive */
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .cover{min-width:0}
  .cover{position:sticky;top:0;height:auto;flex-direction:row;align-items:center;padding:10px 12px;gap:12px;z-index:20;overflow-x:auto}
  .brand{font-size:18px;white-space:nowrap}.brand small{display:none}
  .cover-foot{position:fixed;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));background:var(--cover);color:var(--cover-ink);padding:6px 12px;border-radius:999px;font-size:12px;margin:0;z-index:30;max-width:75vw;box-shadow:0 6px 18px -8px rgba(0,0,0,.4)}
  .nav{flex-direction:row}.nav button{padding:7px 10px;white-space:nowrap}.nav .count{display:none}
  .nav button[aria-current="page"]{box-shadow:inset 0 -2px 0 var(--brass)}
  .toolbar{grid-template-columns:repeat(2,minmax(0,1fr))}
  .split{grid-template-columns:1fr}
  .two{grid-template-columns:1fr}
  .flag{grid-template-columns:1fr}.skill{grid-template-columns:110px 1fr 90px}
  main{padding:18px 12px 60px}
  .grid thead th{top:0}
}
@media (max-width:520px){.toolbar{grid-template-columns:minmax(0,1fr)}.page-title{font-size:25px}.sheet-head{padding:16px}.key{padding:10px 16px}}
</style>
</head>

  function legend(d, ctx, y) {

      }) + 2.5;
    } else {
      txt(d, 'Ölçütler', M, y + 1.5, { style: 'bold', size: 8.8 }); y += 3.4;
      crits(s).forEach((c, i) => {

        y = wrap(d, c.metin || '', M + 9, y, iw - 9, { size: 7.9 }) + 0.6;
      });
      const hasT = s.tur === 'analitik' && crits(s).some(c => (c.tanimlar || []).some(Boolean));
      if (hasT) {
        y = AT(d, {
          ...tbase(), startY: y + 1.5,
          head: [['Ölçüt', ...s.secenekler.map(o => `${o.etiket} (${o.puan})`)]],
          body: crits(s).map((c, i) => ['Ö' + (i + 1), ...s.secenekler.map((o, j) => (c.tanimlar || [])[j] || '')]),
          styles: { ...tbase().styles, fontSize: 6.8 }, columnStyles: { 0: { cellWidth: 11, halign: 'center', fontStyle: 'bold' } }
        }) + 1;
      }
      if (s.tur !== 'kontrol') {
        y = wrap(d, 'Puanlama:  ' + s.secenekler.map(o => `${o.puan} = ${o.etiket}`).join('    '), M, y + 1, iw, { size: 7.8, style: 'bold', color: ACC });
      }
      y += 1;
    }
    y = wrap(d, topluYonerge(s), M, y, iw, { style: 'italic', size: 7.5, color: MUTED });
    return y + 2.2;
  }

  function mainTable(d, ctx, y, filled) {
    const { scale: s, cls, ev } = ctx; const W = pw(d); const iw = W - 2 * M;
    const C = crits(s); const ex = s.ekstra; const opts = s.secenekler || [];
    const mk = st => (filled && ev && ev.marks && ev.marks[st.no]) || {};
    const note = st => (filled && ev && ev.notlar && ev.notlar[st.no]) || '';
    const exv = st => (filled && ev && ev.ekstra && ev.ekstra[st.no]) || '';
    const sum = st => { const m = mk(st); let t = 0, n = 0; C.forEach((c, i) => { const o = opts[m[i]]; if (m[i] != null && o) { t += Number(o.puan) || 0; n++; } }); return n ? String(t) : ''; };
    let head, body, markCols = [], groupEnds = [], fixed, cw;
    const exW = ex ? 17 : 0;
    const col0 = [{ content: 'S.No' }, { content: 'No' }, { content: 'Adı Soyadı' }];
    if (s.tur === 'kontrol') {

        ...C.map((c, i) => ({ content: 'Ö' + (i + 1), colSpan: 2 })), { content: 'Toplam\n(E)', rowSpan: 2 }, { content: 'Not / Dönüt', rowSpan: 2 }],
        C.flatMap(() => ['E', 'H'])];
      body = cls.ogrenciler.map((st, ri) => { const m = mk(st); return [ri + 1, st.no, st.ad, ...(ex ? [exv(st)] : []), ...C.flatMap((c, i) => [m[i] === 0 ? 'X' : '', m[i] === 1 ? 'X' : '']), sum(st), note(st)]; });
      const off = 3 + (ex ? 1 : 0);

      for (let i = 0; i < C.length; i++) groupEnds.push(off + i * 2 + 1);

<script>const EOKUL = (() => {
  async function pdfLines(pdfjs, buf) {
    const pdf = await pdfjs.getDocument({ data: buf }).promise;

      for (const it of tc.items) {
        if (!it.str || !it.str.trim()) continue;
        const y = it.transform[5], x = it.transform[4];
        let row = rows.find(r => Math.abs(r.y - y) < 2.2);
        if (!row) { row = { y, items: [] }; rows.push(row); }
        row.items.push({ x, w: it.width || 0, h: Math.abs(it.transform[0]) || 8, s: it.str });
      }
      rows.sort((a, b) => b.y - a.y);
      pages.push(rows.map(r => {
        const its = r.items.sort((a, b) => a.x - b.x); let out = '', end = null;
        for (const i of its) { if (end !== null && i.x - end > i.h * 0.18) out += ' '; out += i.s; end = i.x + i.w; }
        return out.replace(/\s+/g, ' ').trim();

    return pages;
  }
  function parseClasses(pages) {

        if (i >= 0) kurum = [((lines[i - 1] === 'T.C.' ? 'T.C. ' : '') + lines[i]).trim(), (lines[i + 1] || '').trim()];
      }

      const ogr = (all.match(/Sınıf Öğretmeni:\s*(.+?)(?:\s+Sınıf Başkanı|\n|$)/) || [])[1] || '';
      const cls = found.get(ad) || { ad, ogretmen: ogr.trim(), ogrenciler: [] };
      for (const l of lines) {
        const m = l.match(/^(?:(\d{1,3})\s+)?(\d+)\s+(.+?)\s+(Erkek|Kız)(?:\s+\d{1,3})?$/);

function bindGrid(s, cls) {

    } else { const b = grid.querySelector(`.c[data-r="${r}"][data-c="${c}"]`); b && b.focus(); }
  };
  const optByKey = k => {

  };

      if (s.tur === 'kontrol') { const nx = cur == null ? 0 : cur === 0 ? 1 : null; setMark(r, ci, nx); }
      else openPop(c, `<h4>${esc(cls.ogrenciler[r].ad)} \u00b7 Ö${ci + 1}</h4>` + s.secenekler.map((o, j) => `<button data-o="${j}"><b>${esc(o.puan)}</b>${esc(o.etiket)}</button>`).join('') + (cur != null ? '<hr><button data-o="-1">Temizle</button>' : ''),
        d => { setMark(r, ci, d.o === '-1' ? null : +d.o); focusCell(r, ci); });
    } else if (l) {

      setMark(r, 0, cur === j ? null : j); focusCell(r, 0);
    } else if (h) {

      openPop(h, `<h4>${label} sütunu</h4>` + s.secenekler.map((o, j) => `<button data-a="fill" data-o="${j}"><b>${esc(s.tur === 'kontrol' ? o.kisa : o.puan)}</b>Boş olanları \u201c${esc(o.etiket)}\u201d yap</button>`).join('') + `<hr><button data-a="clear">Sütunu temizle</button>`,
        d => {
          const ev = getEval(s.id, cls.id);

            const m = ev.marks[st.no] || {};
            if (d.a === 'clear') { delete m[ci]; } else if (m[ci] == null) m[ci] = +d.o;
            if (Object.keys(m).length) ev.marks[st.no] = m; else delete ev.marks[st.no];

    if (mv) {
      e.preventDefault();
      if (isL && mv[1]) { const bs = $$('.lvb', t.parentElement); const i = bs.indexOf(t) + mv[1]; if (bs[i]) bs[i].focus(); return; }
      focusCell(Math.max(0, Math.min(cls.ogrenciler.length - 1, r + mv[0])), Math.max(0, Math.min(C.length - 1, c + mv[1])));

    }

    else if (t.dataset.ex != null) { const st = cls.ogrenciler[+t.dataset.ex]; if (t.value) ev.ekstra[st.no] = t.value; else delete ev.ekstra[st.no]; }

  const N = cls.ogrenciler.length; let full = 0; const tots = [];
  cls.ogrenciler.forEach(st => { const ri = rowInfo(s, ev, st); if (ri.full) full++; if (ri.n) tots.push(ri.t); });
  $('#progTxt').textContent = `${N} öğrenciden ${full} tanesi tamamlandı`;
  $('#progBar').style.width = (N ? full / N * 100 : 0) + '%';
  if (!grid) return;
  C.forEach((c, i) => {
    const cnt = s.secenekler.map(() => 0);
    cls.ogrenciler.forEach(st => { const v = ev && ev.marks[st.no] && ev.marks[st.no][i]; if (v != null && cnt[v] != null) cnt[v]++; });
    const td = grid.querySelector(`[data-sum="${i}"]`); if (!td) return;

}

let pdfjsReady = null;
function loadPdfjs() {
  if (pdfjsReady) return pdfjsReady;
  pdfjsReady = new Promise((res, rej) => {
    const sc = document.createElement('script'); sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    sc.onload = () => { try { window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; } catch (e) {} res(window.pdfjsLib); };
    sc.onerror = () => { pdfjsReady = null; rej(new Error('PDF okuyucu yüklenemedi. Bağlantınızı kontrol edin.')); };
    document.head.append(sc);
  });
  return pdfjsReady;
}
async function readPdfPages(file) { const pdfjs = await loadPdfjs(); return EOKUL.pdfLines(pdfjs, new Uint8Array(await file.arrayBuffer())); }

function heuristicScale(text) {
  const tur = /bütüncül/i.test(text) ? 'butuncul' : /analitik/i.test(text) ? 'analitik' : /derecelendirme ölçeği|her zaman|bazen/i.test(text) ? 'derecelendirme' : 'kontrol';
  const etk = (text.match(/Etkinli[ğg]in\s*Ad[ıi]\s*:\s*(.+)/i) || [])[1] || 'İçe aktarılan ölçek';
  const lines = text.split('\n'); const olc = []; let cur = null;
  for (const l of lines) {
    const m = l.match(/^(\d{1,2})\s+(.{6,})$/);
    if (m && Number(m[1]) === olc.length + 1) { cur = { metin: m[2].replace(/\s+(Evet|Hayır)\s*$/i, '').trim(), tanimlar: [] }; olc.push(cur); }
    else if (cur && /^[a-zçğıöşü]/.test(l.trim()) && !/değerlendirme/i.test(l)) cur.metin += ' ' + l.trim();
    else if (/Değerlendirme/i.test(l)) cur = null;
  }
  return normScale({ etkinlik: etk.trim(), tur, olcutler: olc });
}

  [/hazırlık|hazırla|zamanında|görev|ödev|sorumlul|getir/i, 'Sorumluluk'],

  [/konu dışı|hedefin|odaklan|dikkat/i, 'Odaklanma'],
  [/yazım|noktalama|imla|yazılı|metin/i, 'Yazılı anlatım'],
  [/sunum|konuşma|sözlü|sesli/i, 'Sözlü anlatım'],
  [/iletişim|dinle|ifade|anlatım|söz alma|empati/i, 'İletişim'],
  [/eleştir|gerekçe|değerlendir|karşılaştır|kanıt/i, 'Eleştirel düşünme'],
  [/problem|çözüm|strateji/i, 'Problem çözme'],
  [/kaynak|araştır|bilgi topla|veri/i, 'Araştırma'],

  [/kavram|doğru bilgi|bilgi/i, 'Alan bilgisi']
];
function guessBeceri(t) { const x = String(t || '').toLocaleLowerCase('tr'); for (const [re, b] of BECERI_ANAHTAR) if (re.test(x)) return b; return 'Genel'; }
function guessKapsam(t) { return /grup|ekip|takım/.test(String(t || '').toLocaleLowerCase('tr')) ? 'grup' : 'bireysel'; }
function guessScaleBeceri(s) { const g = guessBeceri(s.etkinlik); return g !== 'Genel' ? g : guessBeceri(s.secenekler.map(o => o.tanim).join(' ')); }
function critMeta(s, i) {
  if (s.tur === 'butuncul') return { metin: 'Genel düzey', beceri: s.beceri || guessScaleBeceri(s), tahmin: !s.beceri, kapsam: s.kapsam || 'bireysel' };
  const c = s.olcutler[i] || {}; return { metin: c.metin, beceri: c.beceri || guessBeceri(c.metin), tahmin: !c.beceri, kapsam: c.kapsam || guessKapsam(c.metin) };
}
function tagRow(val, guess, kapsam, dataAttr, act, inputAttr) {
  return `<div class="tagrow"><label>Beceri <input class="inp sm" list="beceriList" ${inputAttr || `${dataAttr} data-k="beceri"`} value="${esc(val)}" placeholder="${esc(guess)} (tahmin)"></label>
    <div class="seg sm" role="group" aria-label="Kapsam"><button data-act="${act}" ${dataAttr} data-v="bireysel" aria-pressed="${kapsam !== 'grup'}">Bireysel</button><button data-act="${act}" ${dataAttr} data-v="grup" aria-pressed="${kapsam === 'grup'}">Grup</button></div></div>`;
}
function fillBeceriList() {
  const used = new Set(BECERILER);
  Object.values(S.scales).forEach(s => { if (s.beceri) used.add(s.beceri); s.olcutler.forEach(c => c.beceri && used.add(c.beceri)); });
  $('#beceriList').innerHTML = [...used].sort(coll.compare).map(b => `<option value="${esc(b)}">`).join('');
}
async function suggestTags(s, btn) {

  if (s.tur === 'butuncul') { s.beceri = String(res[0]?.beceri || guessScaleBeceri(s)); s.kapsam = res[0]?.kapsam === 'grup' ? 'grup' : 'bireysel'; }
  else s.olcutler.forEach((c, i) => { const r = res[i] || {}; c.beceri = String(r.beceri || guessBeceri(c.metin)); c.kapsam = r.kapsam === 'grup' ? 'grup' : 'bireysel'; });
  store.save('scales', s.id, 0); renderScaleEditor(s); fillBeceriList();

/* =========================================================
   ANALİZ MOTORU
   ========================================================= */
const MIN_GOZLEM = 3;
function observations(cls, withGroup) {
  const out = [];
  for (const ev of Object.values(S.evals)) {
    if (ev.classId !== cls.id) continue; const s = S.scales[ev.scaleId]; if (!s) continue;
    const ps = s.secenekler.map(o => Number(o.puan) || 0); const mn = Math.min(...ps), mx = Math.max(...ps);
    const C = critsOf(s);
    for (const st of cls.ogrenciler) {
      const m = ev.marks && ev.marks[st.no]; if (!m) continue;
      C.forEach((c, i) => {
        const oi = m[i]; const o = s.secenekler[oi]; if (oi == null || !o) return;
        const meta = critMeta(s, i); if (meta.kapsam === 'grup' && !withGroup) return;
        out.push({ no: st.no, scaleId: s.id, etkinlik: s.etkinlik, tur: s.tur, tarih: ev.tarih || '', ci: i, kod: s.tur === 'butuncul' ? 'Düzey' : 'Ö' + (i + 1), metin: meta.metin, beceri: meta.beceri, kapsam: meta.kapsam,
          v: mx === mn ? 1 : ((Number(o.puan) || 0) - mn) / (mx - mn), sonuc: s.tur === 'kontrol' ? o.etiket : `${o.puan}${o.etiket && o.etiket !== String(o.puan) ? ' \u00b7 ' + o.etiket : ''}` });
      });
    }
  }
  return out;
}
const mean = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
function trendOf(list) {
  if (list.length < MIN_GOZLEM) return null;
  const sorted = [...list].sort((a, b) => (a.tarih || '').localeCompare(b.tarih || ''));
  const h = Math.floor(sorted.length / 2); const d = mean(sorted.slice(-h).map(o => o.v)) - mean(sorted.slice(0, h).map(o => o.v));
  return d >= 0.2 ? 'up' : d <= -0.2 ? 'down' : 'flat';
}
function studentProfile(cls, st, obs) {
  const mine = obs.filter(o => o.no === st.no); const by = {};
  mine.forEach(o => (by[o.beceri] = by[o.beceri] || []).push(o));
  const skills = Object.entries(by).map(([ad, l]) => ({ ad, n: l.length, m: mean(l.map(o => o.v)), low: l.filter(o => o.v < 0.5).length, trend: trendOf(l), obs: l })).sort((a, b) => coll.compare(a.ad, b.ad));
  const flags = [];
  skills.forEach(k => { if (k.low >= 2 && k.m < 0.5) flags.push({ t: `${k.ad}: ${k.n} gözlemin ${k.low}'${ek(k.low)} olumsuz`, lvl: 'lo' }); else if (k.trend === 'down' && k.m < 0.75) flags.push({ t: `${k.ad}: düşüş eğiliminde`, lvl: 'warn' }); });
  mine.filter(o => o.tur === 'butuncul' && o.v < 0.5).forEach(o => flags.push({ t: `${o.etkinlik}: düzey ${o.sonuc.split(' ')[0]}`, lvl: 'lo' }));
  return { st, obs: mine, skills, flags };
}
function ek(n) { if (n % 10 === 0) return { 10: 'u', 20: 'si', 30: 'u', 40: 'ı', 50: 'si', 60: 'ı', 70: 'i', 80: 'i', 90: 'ı' }[n % 100] || 'ü'; return { 1: 'i', 2: 'si', 3: 'ü', 4: 'ü', 5: 'i', 6: 'sı', 7: 'si', 8: 'i', 9: 'u' }[n % 10]; }
const pctTxt = v => v == null ? '' : '%' + Math.round(v * 100);
function summaryText(p) {
  const ok = p.skills.filter(k => k.n >= MIN_GOZLEM);
  if (!p.obs.length) return 'Bu öğrenci için henüz işaretlenmiş gözlem yok.';
  if (!ok.length) return `Toplam ${p.obs.length} gözlem var; eğilim göstermek için her beceride en az ${MIN_GOZLEM} gözlem gerekiyor.`;
  const strong = ok.filter(k => k.m >= 0.75).sort((a, b) => b.m - a.m), weak = ok.filter(k => k.m < 0.5).sort((a, b) => a.m - b.m);
  const tr = { up: 'yükseliyor', down: 'düşüyor' }; const parts = [];
  if (strong.length) parts.push('Güçlü görünen alanlar: ' + strong.map(k => `${k.ad} (${pctTxt(k.m)}, ${k.n} gözlem${k.trend && tr[k.trend] ? ', ' + tr[k.trend] : ''})`).join(', ') + '.');
  if (weak.length) parts.push('Gelişime açık alanlar: ' + weak.map(k => `${k.ad} (${pctTxt(k.m)}, ${k.n} gözlem${k.trend && tr[k.trend] ? ', ' + tr[k.trend] : ''})`).join(', ') + '.');
  const mid = ok.filter(k => k.m >= 0.5 && k.m < 0.75); if (mid.length) parts.push('Orta düzeyde: ' + mid.map(k => k.ad).join(', ') + '.');
  const few = p.skills.filter(k => k.n < MIN_GOZLEM); if (few.length) parts.push(`Az gözlemli (henüz yorum yapılmayan): ${few.map(k => k.ad).join(', ')}.`);
  return parts.join(' ');
}
function classStruggles(cls, withGroup) {
  const out = [];
  for (const ev of Object.values(S.evals)) {
    if (ev.classId !== cls.id) continue; const s = S.scales[ev.scaleId]; if (!s) continue;
    const ps = s.secenekler.map(o => Number(o.puan) || 0); const mn = Math.min(...ps), mx = Math.max(...ps);
    critsOf(s).forEach((c, i) => {
      const meta = critMeta(s, i); if (meta.kapsam === 'grup' && !withGroup) return;
      let n = 0, low = 0; cls.ogrenciler.forEach(st => { const oi = ev.marks?.[st.no]?.[i]; const o = s.secenekler[oi]; if (oi == null || !o) return; n++; if ((mx === mn ? 1 : (o.puan - mn) / (mx - mn)) < 0.5) low++; });
      if (n >= 5 && low / n >= 0.4) out.push({ s, i, meta, n, low, r: low / n });
    });
  }
  return out.sort((a, b) => b.r - a.r);
}
const hcClass = k => !k ? 'none' : (k.n < MIN_GOZLEM ? 'few ' : '') + (k.m >= 0.75 ? 'hi' : k.m >= 0.5 ? 'mid' : 'lo');

    const FB = { db, doc: fs.doc, collection: fs.collection, getDoc: fs.getDoc, getDocs: fs.getDocs, setDoc: fs.setDoc, deleteDoc: fs.deleteDoc,
      signIn: (e, p) => au.signInWithEmailAndPassword(auth, e, p), signUp: (e, p) => au.createUserWithEmailAndPassword(auth, e, p),
      reset: e => au.sendPasswordResetEmail(auth, e), signOut: () => au.signOut(auth), user: null };
    au.onAuthStateChanged(auth, u => { FB.user = u; window.__boot(FB); });
  } catch (e) { document.getElementById('main').innerHTML = '<div class="sheet empty-state"><h2>Uygulama başlatılamadı</h2><p>İnternet bağlantınızı ve firebase-config.js dosyasını kontrol edin.</p></div>'; console.error(e); }
}
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
